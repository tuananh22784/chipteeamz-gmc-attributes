name: GMC Attributes V1.1 Read-Only Audit
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of GMC items to audit (max 500 for initial QA)"
        required: true
        default: '500'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Validate code
        run: |
          python -m py_compile engine.py live.py
          python -m unittest discover -s tests -v
      - name: GMC + Shopify read-only audit
        env:
          GMC_ACCOUNT_ID: ${{ secrets.GMC_ACCOUNT_ID }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/merchant-credentials.json
          MERCHANT_SERVICE_ACCOUNT_JSON: ${{ secrets.MERCHANT_SERVICE_ACCOUNT_JSON }}
          AUDIT_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          test -n "$MERCHANT_SERVICE_ACCOUNT_JSON"
          printf '%s' "$MERCHANT_SERVICE_ACCOUNT_JSON" > merchant-credentials.json
          chmod 600 merchant-credentials.json
          trap 'rm -f merchant-credentials.json' EXIT
          python engine.py audit-live --limit "$AUDIT_LIMIT" --out out
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gmc-attributes-v1-1-audit
          path: out/
          if-no-files-found: warn
          retention-days: 7
