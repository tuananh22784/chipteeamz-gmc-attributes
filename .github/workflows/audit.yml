name: GMC Attributes V1.2 Read-Only Audit
on:
  workflow_dispatch:
    inputs:
      page_size:
        description: 'GMC page size (1-1000)'
        required: true
        default: '500'
      max_pages:
        description: 'Maximum pages this run (0=all; start with 1)'
        required: true
        default: '1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test and validate
        run: |
          python -m py_compile engine.py live.py
          python -m unittest discover -s tests -v
      - name: Read-only GMC and Shopify audit
        env:
          GMC_ACCOUNT_ID: ${{ secrets.GMC_ACCOUNT_ID }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/merchant-credentials.json
          MERCHANT_SERVICE_ACCOUNT_JSON: ${{ secrets.MERCHANT_SERVICE_ACCOUNT_JSON }}
          PAGE_SIZE: ${{ inputs.page_size }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          set -euo pipefail
          test -n "$MERCHANT_SERVICE_ACCOUNT_JSON"
          printf '%s' "$MERCHANT_SERVICE_ACCOUNT_JSON" > merchant-credentials.json
          chmod 600 merchant-credentials.json
          trap 'rm -f merchant-credentials.json' EXIT
          python engine.py audit-live --page-size "$PAGE_SIZE" --max-pages "$MAX_PAGES" --out out
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gmc-attributes-v1-2-audit
          path: out/
          if-no-files-found: warn
          retention-days: 7
